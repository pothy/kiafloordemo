# Nginx Server Configuration for kiafloor.sabtom.com

upstream kiafloor_app {
    server 127.0.0.1:8000; # or unix:/run/kiafloor.sock;
}

server {
    listen 80;
    server_name kiafloor.sabtom.com;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name kiafloor.sabtom.com;

    # SSL Certificate Paths (Let's Encrypt / Certbot default locations)
    # ssl_certificate /etc/letsencrypt/live/kiafloor.sabtom.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/kiafloor.sabtom.com/privkey.pem;

    # Basic SSL optimizations
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 50M;

    # Serve static files directly
    location /static/ {
        alias /var/www/kiafloor/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy request to Gunicorn WSGI Application
    location / {
        proxy_pass http://kiafloor_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
