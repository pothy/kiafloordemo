version: '3.8'

services:
  web:
    build: .
    container_name: kiafloor_web
    restart: always
    environment:
      - DEBUG=False
      - ALLOWED_HOSTS=kiafloor.sabtom.com,localhost,127.0.0.1
      - CSRF_TRUSTED_ORIGINS=https://kiafloor.sabtom.com,http://kiafloor.sabtom.com
      - SECRET_KEY=change-this-to-a-secure-random-secret-key-in-production
    ports:
      - "8000:8000"
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
      - ./staticfiles:/app/staticfiles
